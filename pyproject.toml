[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soybean-oil-predictor"
version = "0.2.0"
description = "Commodity price forecasting for the front-month soybean oil contract (BOC1)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<20",
    "scipy>=1.14,<2",
    "scikit-learn>=1.5,<2",
    "statsmodels>=0.14,<1",
    "joblib>=1.4,<2",
    "xgboost>=2.1,<3",
    "lightgbm>=4.5,<5",
    "statsforecast>=2.0,<3",
    "optuna>=4.0,<5",
    "shap>=0.46,<1",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "duckdb>=1.2,<2",
    "deltalake>=0.24,<1",
    "mlflow>=2.21,<3",
    "evidently>=0.5,<1",
    "structlog>=25.1,<26",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "pre-commit>=4",
    "ipython>=9",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
